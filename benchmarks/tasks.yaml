# JARVIS task benchmark (docs/07_TESTING_AND_BENCHMARK.md section 3.2)
#
# Format: docs/07 section 3.1.  Every file is validated by
# src/jarvis/benchmark/tasks.py, so a typo in expected.type is a load error
# rather than a silently-passing case.
#
# Conventions
#   {sandbox}      replaced with the absolute sandbox root (benchmarks/sandbox)
#   expected.value for file_* checks is relative to that root
#   tier_expected  must match the tool's declared base_tier for auto_confirm to
#                  fire; a mismatch makes the scripted responder answer "no",
#                  which is how the tier gate gets exercised
#   auto_confirm   the scripted user approves (and unlocks for Tier 2)
#
# Sandbox only: allowed_roots is the sandbox for the whole run, so a task that
# names a path outside it is expected to be refused, not performed.
# See benchmarks/redteam.yaml for the injection/safety suite.

