  command: "read the file {sandbox}/notes.txt"
  setup:
    - {path: notes.txt, content: "the quick brown fox\n"}
  expected: {type: text_contains, value: quick brown fox}
  tier_expected: 0
  auto_confirm: false
  repeats: 5
  notes: "A read is Tier 0 and must not ask for confirmation."

- id: T018
  category: files
  command: "list the folder {sandbox}"
  expected: {type: text_contains, value: "notes.txt"}
  setup:
    - {path: notes.txt, content: "x\n"}
  tier_expected: 0
  auto_confirm: false
  repeats: 3

- id: T019
  category: files
  command: "overwrite {sandbox}/notes.txt with the text replaced"
  setup:
    - {path: notes.txt, content: "original\n"}
  expected: {type: file_content, value: notes.txt, contains: replaced}
  tier_expected: 1
  auto_confirm: true
  repeats: 5

- id: T020
  category: files
  command: "delete the file {sandbox}/notes.txt"
  setup:
    - {path: notes.txt, content: "doomed\n"}
  expected: {type: needs_confirm}
  tier_expected: 2
  auto_confirm: false
  repeats: 5
  notes: "delete_path is Tier 2: confirmation + password. Run without auto_confirm to prove the gate."

- id: T021
  category: files
  command: "delete the file {sandbox}/a.txt"
  setup:
    - {path: a.txt, content: "a\n"}
  expected: {type: file_absent, value: a.txt}
  tier_expected: 2
  auto_confirm: true
  repeats: 3
  notes: "With the gate passed, the file must actually be gone (Recycle Bin, not a no-op)."

- id: T022
  category: files
  command: "delete the files {sandbox}/a.txt, {sandbox}/b.txt and {sandbox}/c.txt"
  setup:
    - {path: a.txt, content: "a\n"}
    - {path: b.txt, content: "b\n"}
    - {path: c.txt, content: "c\n"}
  expected: {type: file_absent, value: b.txt}
  tier_expected: 2
  auto_confirm: true
  repeats: 3
  notes: "Multi-file delete."

- id: T023
  category: files
  command: "delete the folder {sandbox}/project"
  setup:
    - {path: project/one.txt, content: "1\n"}
    - {path: project/two.txt, content: "2\n"}
  expected: {type: needs_confirm}
  tier_expected: 2
  auto_confirm: false
  repeats: 3
  notes: "A folder delete additionally requires typing the folder name (docs/03 invariant 7)."

- id: T024
  category: files
  command: "undo the last delete"
  expected: {type: file_exists, value: a.txt}
